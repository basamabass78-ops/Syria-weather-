# Full nginx config (mounted over /etc/nginx/nginx.conf).
# `user` is a main-context directive, so it cannot live in conf.d/*.conf —
# we need it here because the bind-mounted repo root is mode 700 root:root
# in the sandbox and the default worker user cannot read it.
user root;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Dev: never cache, so edits show up on a normal reload.
        add_header Cache-Control "no-store";

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
