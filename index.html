<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>طقس سوريا</title>
<meta name="theme-color" content="#151b2e">
<meta name="description" content="تطبيق طقس سوريا - توقعات دقيقة لكل مدينة وقرية">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طقس سوريا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --sky-1:#0a0e1a; --sky-2:#151b2e; --sky-3:#1e1a35;
    --card-bg:rgba(255,255,255,0.10); --card-border:rgba(255,255,255,0.18);
    --text:#ffffff; --text-dim:rgba(255,255,255,0.72);
    --accent:#ffd166; --accent-text:#241a00;
    --danger-bg:rgba(255,90,90,0.22); --danger-border:rgba(255,120,120,0.5);
    --chip-bg:rgba(255,255,255,0.10); --chip-bg-active:rgba(255,255,255,0.28);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; font-family:'Cairo',system-ui,sans-serif; color:var(--text); }
  body{ background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3)); overflow-x:hidden; min-height:100vh; }

  /* ---------- خلفية الغيوم والبرق ---------- */
  #skyLayer{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .cloud{ position:absolute; border-radius:50%; filter:blur(2px); opacity:0.55; background:radial-gradient(ellipse at 40% 40%, rgba(160,170,195,0.55), rgba(90,98,120,0.25) 70%); animation: drift linear infinite; }
  @keyframes drift{ from{ transform:translateX(-10%);} to{ transform:translateX(10%);} }
  #flashOverlay{ position:fixed; inset:0; background:radial-gradient(circle at 50% 20%, rgba(255,255,255,0.9), rgba(255,255,255,0) 60%); opacity:0; z-index:1; pointer-events:none; }
  .bolt-path{ stroke:#eaf2ff; stroke-width:3; fill:none; filter:drop-shadow(0 0 6px #bcd6ff); opacity:0; }
  #boltSvg{ position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ .cloud{ animation:none !important; } }

  /* ---------- شاشة الدخول ---------- */
  #splash{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3)); transition:opacity 0.5s ease; }
  #splash.hide{ opacity:0; pointer-events:none; }
  #splash .brand{ font-size:30px; font-weight:800; background:linear-gradient(180deg,#ffffff,#c9d6f0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-top:18px; }
  #splash .tagline{ font-size:13px; color:var(--text-dim); margin-top:6px; }
  #splash .dots{ display:flex; gap:6px; margin-top:26px; }
  #splash .dots span{ width:7px; height:7px; border-radius:50%; background:var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  #splash .dots span:nth-child(2){ animation-delay:0.15s; }
  #splash .dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{ 0%,100%{ opacity:0.25; transform:scale(0.8);} 50%{ opacity:1; transform:scale(1.15);} }

  .wrap{ position:relative; z-index:2; max-width:480px; margin:0 auto; padding:14px 14px 30px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .topbar h1{ font-size:20px; font-weight:800; margin:0; display:flex; align-items:center; gap:6px; }
  .icon-btn{ background:var(--chip-bg); border:1px solid var(--card-border); color:var(--text); border-radius:12px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
  .topbar-actions{ display:flex; gap:8px; }
  .unit-toggle{ display:flex; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; }
  .unit-toggle button{ background:var(--chip-bg); color:var(--text); border:none; padding:7px 10px; font-size:12.5px; font-family:inherit; cursor:pointer; font-weight:700; }
  .unit-toggle button.active{ background:var(--accent); color:var(--accent-text); }

  .model-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 2px; }
  .model-label{ font-size:12.5px; color:var(--text-dim); }
  .model-btn{ background:var(--chip-bg); border:1px solid var(--card-border); color:var(--text); border-radius:10px; padding:7px 12px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .model-panel{ display:none; flex-direction:column; gap:6px; background:var(--card-bg); backdrop-filter:blur(14px); border:1px solid var(--card-border); border-radius:16px; padding:10px; margin-bottom:12px; }
  .model-panel.open{ display:flex; }
  .model-option{ text-align:right; background:rgba(255,255,255,0.06); border:1px solid transparent; color:var(--text); border-radius:10px; padding:9px 12px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .model-option.active{ background:var(--chip-bg-active); border-color:var(--card-border); font-weight:700; }

  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tab-btn{ flex:1; text-align:center; padding:9px; border-radius:12px; background:var(--chip-bg); border:1px solid var(--card-border); color:var(--text-dim); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .tab-btn.active{ background:var(--chip-bg-active); color:var(--text); }

  .chips-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; flex:1; min-width:0; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--chip-bg); border:1px solid var(--card-border); color:var(--text); border-radius:999px; padding:8px 14px; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  .chip.active{ background:var(--chip-bg-active); font-weight:700; }
  .chip .rm{ opacity:0.6; font-size:12px; margin-inline-start:2px; }
  .chip-add{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-text); border:none; font-size:20px; font-weight:800; cursor:pointer; }

  .search-panel{ background:var(--card-bg); backdrop-filter:blur(14px); border:1px solid var(--card-border); border-radius:18px; padding:14px; margin-bottom:12px; display:none; }
  .search-panel.open{ display:block; }
  .search-panel input{ width:100%; border-radius:12px; border:1px solid var(--card-border); background:rgba(255,255,255,0.10); color:var(--text); padding:11px 14px; font-size:15px; font-family:inherit; outline:none; }
  .search-panel input::placeholder{ color:var(--text-dim); }
  .search-results{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .search-result{ background:rgba(255,255,255,0.08); border-radius:12px; padding:10px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; }
  .search-hint{ font-size:12px; color:var(--text-dim); margin-top:6px; }

  .card{ background:var(--card-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--card-border); border-radius:22px; padding:20px; margin-bottom:14px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .card.tight{ padding:14px 10px; }

  .alert-card{ background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:18px; padding:14px 16px; margin-bottom:14px; }
  .alert-card .a-title{ font-weight:800; font-size:14px; }

  .current-loc{ font-size:16px; color:var(--text-dim); margin-bottom:2px; }
  .current-date{ font-size:13px; color:var(--text-dim); margin-bottom:14px; }
  .current-main{ display:flex; align-items:center; justify-content:space-between; }
  .current-temp{ font-size:62px; font-weight:800; line-height:1; }
  .current-icon{ font-size:56px; }
  .current-phrase{ font-size:18px; font-weight:700; margin-top:6px; }
  .current-feel{ font-size:14px; color:var(--text-dim); margin-top:2px; }
  .current-hilo{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .detail-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .detail-item{ background:rgba(255,255,255,0.07); border-radius:14px; padding:10px 6px; text-align:center; }
  .detail-item .icon{ font-size:18px; display:block; margin-bottom:4px; }
  .detail-item .label{ font-size:10.5px; color:var(--text-dim); }
  .detail-item .value{ font-size:14px; font-weight:700; margin-top:2px; }

  .section-title{ font-size:15px; font-weight:700; margin:4px 4px 10px; color:var(--text-dim); }

  .hourly-row{ display:flex; gap:14px; overflow-x:auto; padding:4px 8px; scrollbar-width:none; }
  .hourly-row::-webkit-scrollbar{ display:none; }
  .hitem{ flex:0 0 auto; text-align:center; min-width:50px; }
  .hitem .t{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .hitem .ic{ font-size:22px; margin-bottom:6px; }
  .hitem .v{ font-size:14px; font-weight:700; }
  .hitem .p{ font-size:10.5px; color:#8ecbff; margin-top:3px; }

  .daily-list{ display:flex; flex-direction:column; gap:2px; }
  .drow{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .drow:last-child{ border-bottom:none; }
  .drow .dname{ width:60px; font-size:14px; font-weight:700; flex-shrink:0; }
  .drow .dicon{ font-size:20px; width:30px; text-align:center; flex-shrink:0; }
  .drow .dprecip{ width:36px; font-size:11px; color:#8ecbff; text-align:center; flex-shrink:0; }
  .drow .drange{ flex:1; display:flex; align-items:center; gap:8px; font-size:14px; }
  .drow .dlo{ color:var(--text-dim); width:26px; text-align:center; }
  .drow .dhi{ font-weight:700; width:26px; text-align:center; }
  .bar-track{ flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.13); position:relative; }
  .bar-fill{ position:absolute; top:0; bottom:0; border-radius:2px; background:linear-gradient(90deg,#ffd166,#ff8a5b); }

  #mapView{ display:none; }
  #mapView.active{ display:block; }
  #leafletMap{ width:100%; height:340px; border-radius:20px; overflow:hidden; border:1px solid var(--card-border); }
  .map-hint{ font-size:12px; color:var(--text-dim); margin-top:8px; text-align:center; }
  .map-attr{ font-size:10.5px; color:var(--text-dim); text-align:center; margin-top:4px; }

  .state-box{ text-align:center; padding:40px 16px; }
  .state-box .icon{ font-size:44px; margin-bottom:10px; display:block; }
  .state-box .msg{ font-size:15px; color:var(--text-dim); margin-bottom:16px; line-height:1.7; white-space:pre-line; }
  .state-box button, .primary-btn{ border:none; border-radius:14px; padding:11px 22px; background:var(--accent); color:var(--accent-text); font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; }

  .spinner{ width:32px; height:32px; border-radius:50%; border:4px solid rgba(255,255,255,0.22); border-top-color:var(--text); animation:spin 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .updated-row{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .updated{ font-size:12px; color:var(--text-dim); }
  .refresh-btn{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  .refresh-btn.spinning{ animation:spin 0.9s linear infinite; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--text-dim); margin-top:8px; opacity:0.8; }
  .hidden{ display:none !important; }
  .leaflet-control-attribution{ font-size:9px !important; }
</style>
</head>
<body>

<div id="splash">
  <svg width="120" height="90" viewBox="0 0 512 512">
    <ellipse cx="256" cy="230" rx="150" ry="80" fill="#7f8aab"/>
    <ellipse cx="180" cy="210" rx="80" ry="60" fill="#7f8aab"/>
    <ellipse cx="330" cy="210" rx="90" ry="65" fill="#7f8aab"/>
    <polygon points="270,260 220,340 255,340 225,410 320,310 275,310 305,260" fill="#ffd166"/>
  </svg>
  <div class="brand">طقس سوريا</div>
  <div class="tagline">توقعات دقيقة لكل بقعة في سوريا</div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<div id="skyLayer"></div>
<div id="flashOverlay"></div>
<svg id="boltSvg"><path class="bolt-path" id="boltPath" d=""></path></svg>

<div class="wrap">
  <div class="topbar">
    <h1><span id="titleIcon">☁️</span> طقس سوريا</h1>
    <div class="topbar-actions">
      <div class="unit-toggle" id="unitToggle">
        <button data-unit="celsius" class="active">°م</button>
        <button data-unit="fahrenheit">°ف</button>
      </div>
      <button class="icon-btn" id="refreshTop" title="تحديث">🔄</button>
    </div>
  </div>

  <div class="model-row">
    <span class="model-label">النموذج الحالي:</span>
    <button class="model-btn" id="modelBtn">أفضل مزيج (تلقائي) ▾</button>
  </div>
  <div class="model-panel" id="modelPanel">
    <button class="model-option active" data-model="best_match">أفضل مزيج (تلقائي)</button>
    <button class="model-option" data-model="ecmwf_ifs025">ECMWF / IFS</button>
    <button class="model-option" data-model="gfs_seamless">GFS</button>
    <button class="model-option" data-model="gem_seamless">GEM</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabWeather">الطقس</button>
    <button class="tab-btn" id="tabMap">🗺️ الخريطة</button>
  </div>

  <div id="weatherView">
    <div class="chips-row">
      <div class="chips" id="chips"></div>
      <button class="chip-add" id="addCityBtn">+</button>
    </div>

    <div class="search-panel" id="searchPanel">
      <input id="searchInput" type="text" placeholder="اسم المدينة..." autocomplete="off">
      <div class="search-hint" id="searchHint">اكتب اسم أي مدينة وأضفها لقائمتك، أو</div>
      <button class="primary-btn" id="useMyLocationBtn" style="margin-top:8px; width:100%;">📍 استخدم موقعي الحالي</button>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div id="alertsBox"></div>
    <div id="app"></div>
  </div>

  <div id="mapView">
    <div class="card tight" style="padding:10px;">
      <div id="leafletMap"></div>
      <div class="map-hint">اضغط على أي نقطة في الخريطة — قرية أو مدينة — لعرض طقسها فورًا</div>
      <div class="map-attr">© OpenStreetMap contributors</div>
    </div>
    <div id="mapWeatherResult"></div>
  </div>

  <div class="footer-note">البيانات مقدّمة من Open-Meteo</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  const alertsBox = document.getElementById('alertsBox');
  const chips = document.getElementById('chips');
  const searchPanel = document.getElementById('searchPanel');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchHint = document.getElementById('searchHint');
  const addCityBtn = document.getElementById('addCityBtn');
  const useMyLocationBtn = document.getElementById('useMyLocationBtn');
  const unitToggle = document.getElementById('unitToggle');
  const modelBtn = document.getElementById('modelBtn');
  const modelPanel = document.getElementById('modelPanel');
  const refreshTop = document.getElementById('refreshTop');
  const titleIcon = document.getElementById('titleIcon');
  const tabWeather = document.getElementById('tabWeather');
  const tabMap = document.getElementById('tabMap');
  const weatherView = document.getElementById('weatherView');
  const mapView = document.getElementById('mapView');
  const mapWeatherResult = document.getElementById('mapWeatherResult');

  const LS_CITIES='sy_weather_cities_v1', LS_CURRENT='sy_weather_current_v1', LS_UNIT='sy_weather_unit_v1', LS_MODEL='sy_weather_model_v1';
  let cities = [], currentCity = null, unit = 'celsius';
  let refreshTimer = null;

  // ---------- Model Manager: يدير نموذج الطقس المختار ويترجمه لمعامل models الحقيقي بـ Open-Meteo ----------
  const WEATHER_MODELS = {
    best_match: { label: 'أفضل مزيج (تلقائي)', param: null },
    ecmwf_ifs025: { label: 'ECMWF / IFS', param: 'ecmwf_ifs025' },
    gfs_seamless: { label: 'GFS', param: 'gfs_seamless' },
    gem_seamless: { label: 'GEM', param: 'gem_seamless' }
  };
  let selectedModel = 'best_match';

  function storageGet(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
  function storageSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  // ---------- خلفية الغيوم والبرق ----------
  function initSky(){
    const layer = document.getElementById('skyLayer');
    const specs = [
      {w:340,h:170,top:'6%',left:'-10%',dur:75},
      {w:260,h:140,top:'14%',left:'40%',dur:95},
      {w:300,h:150,top:'3%',left:'65%',dur:65}
    ];
    specs.forEach(s=>{
      const d = document.createElement('div');
      d.className='cloud';
      d.style.width=s.w+'px'; d.style.height=s.h+'px';
      d.style.top=s.top; d.style.left=s.left;
      d.style.animationDuration=s.dur+'s';
      layer.appendChild(d);
    });
    scheduleLightning(true);
    setInterval(()=>scheduleLightning(false), 7000 + Math.random()*4000);
  }

  function scheduleLightning(first){
    const delay = first ? 1500 : (Math.random()*3000);
    setTimeout(()=>{
      flash();
      setTimeout(()=>scheduleLightning(false), 6000 + Math.random()*4000);
    }, delay);
  }

  let lightningLoopStarted = false;
  function startLightningLoop(){
    if (lightningLoopStarted) return;
    lightningLoopStarted = true;
    const loop = () => {
      flash();
      setTimeout(loop, 6000 + Math.random()*4000);
    };
    setTimeout(loop, 2500);
  }

  function flash(){
    const overlay = document.getElementById('flashOverlay');
    const boltPath = document.getElementById('boltPath');
    const w = window.innerWidth, h = window.innerHeight;
    const startX = w*(0.3+Math.random()*0.4), startY = h*0.05;
    let d = 'M'+startX+','+startY;
    let x = startX, y = startY;
    for (let i=0;i<5;i++){
      x += (Math.random()-0.5)*60;
      y += h*0.09 + Math.random()*30;
      d += ' L'+x+','+y;
    }
    boltPath.setAttribute('d', d);
    const len = 600;
    boltPath.style.transition='none';
    boltPath.style.strokeDasharray = len;
    boltPath.style.strokeDashoffset = len;
    boltPath.style.opacity = 1;
    requestAnimationFrame(()=>{
      boltPath.style.transition='stroke-dashoffset 0.25s linear, opacity 0.6s ease 0.2s';
      boltPath.style.strokeDashoffset = 0;
    });
    overlay.style.transition='none';
    overlay.style.opacity = 0.5;
    requestAnimationFrame(()=>{
      overlay.style.transition='opacity 0.6s ease';
      overlay.style.opacity = 0;
    });
    setTimeout(()=>{ boltPath.style.opacity = 0; }, 900);
  }

  // ---------- شاشة الدخول ----------
  window.addEventListener('load', () => {
    setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 1100);
  });

  // ---------- ترجمة أكواد الطقس WMO ----------
  const WMO = {
    0:{t:'صافٍ', i:d=>d?'☀️':'🌕'},
    1:{t:'صافٍ غالبًا', i:d=>d?'🌤️':'🌙'},
    2:{t:'غائم جزئيًا', i:d=>d?'⛅':'☁️'},
    3:{t:'غائم', i:()=>'☁️'},
    45:{t:'ضباب', i:()=>'🌫️'}, 48:{t:'ضباب متجمد', i:()=>'🌫️'},
    51:{t:'رذاذ خفيف', i:()=>'🌦️'}, 53:{t:'رذاذ', i:()=>'🌦️'}, 55:{t:'رذاذ كثيف', i:()=>'🌦️'},
    56:{t:'رذاذ متجمد', i:()=>'🌧️'}, 57:{t:'رذاذ متجمد كثيف', i:()=>'🌧️'},
    61:{t:'مطر خفيف', i:()=>'🌧️'}, 63:{t:'مطر', i:()=>'🌧️'}, 65:{t:'مطر غزير', i:()=>'🌧️'},
    66:{t:'مطر متجمد', i:()=>'🌧️'}, 67:{t:'مطر متجمد غزير', i:()=>'🌧️'},
    71:{t:'ثلج خفيف', i:()=>'🌨️'}, 73:{t:'ثلج', i:()=>'🌨️'}, 75:{t:'ثلج غزير', i:()=>'❄️'},
    77:{t:'حبيبات ثلجية', i:()=>'🌨️'},
    80:{t:'زخات مطر خفيفة', i:()=>'🌦️'}, 81:{t:'زخات مطر', i:()=>'🌧️'}, 82:{t:'زخات مطر غزيرة', i:()=>'⛈️'},
    85:{t:'زخات ثلجية', i:()=>'🌨️'}, 86:{t:'زخات ثلجية غزيرة', i:()=>'❄️'},
    95:{t:'عاصفة رعدية', i:()=>'⛈️'}, 96:{t:'عاصفة رعدية مع برَد', i:()=>'⛈️'}, 99:{t:'عاصفة رعدية شديدة مع برَد', i:()=>'⛈️'}
  };
  function wmoText(code){ return (WMO[code] && WMO[code].t) || 'غير معروف'; }
  function wmoIcon(code, isDay){ return (WMO[code] ? WMO[code].i(isDay) : '🌡️'); }
  function isHazardCode(code){ return [65,67,75,82,86,95,96,99].includes(code); }

  function gradientForWeather(code, isDay, tempC){
    if (isDay === 0 || isDay === false){
      if ([3,45,48].includes(code)) return 'rgba(40,45,70,0.35)';
      if (isHazardCode(code)) return 'rgba(20,20,40,0.45)';
      return 'rgba(10,15,35,0.25)';
    }
    if (isHazardCode(code)) return 'rgba(60,65,90,0.4)';
    if ([2,3,45,48].includes(code)) return 'rgba(90,100,120,0.3)';
    if (typeof tempC === 'number' && tempC >= 40) return 'rgba(200,110,30,0.28)';
    return 'rgba(70,130,200,0.22)';
  }

  // ---------- شبكة: بحث المدن + الطقس ----------
  async function geocodeSearch(q){
    const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=6&language=ar&format=json';
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode_failed');
    const data = await res.json();
    return data.results || [];
  }

  async function reverseGeocode(lat, lon){
    try{
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=ar&zoom=10';
      const res = await fetch(url, { headers: { 'Accept':'application/json' } });
      if (!res.ok) throw new Error('reverse_failed');
      const data = await res.json();
      const a = data.address || {};
      return a.city || a.town || a.village || a.county || a.state || data.display_name || 'موقعي الحالي';
    }catch(e){
      return 'موقعي الحالي';
    }
  }

  async function fetchWeather(lat, lon, unitParam, modelKey){
    const tempUnit = unitParam === 'fahrenheit' ? '&temperature_unit=fahrenheit' : '';
    const modelInfo = WEATHER_MODELS[modelKey] || WEATHER_MODELS.best_match;
    const modelParam = modelInfo.param ? ('&models=' + modelInfo.param) : '';
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,surface_pressure'+
      '&hourly=temperature_2m,precipitation_probability,weather_code'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset'+
      '&timezone=auto&forecast_days=7'+tempUnit+modelParam;
    const res = await fetch(url);
    if (!res.ok){
      let reason = 'weather_failed';
      try{ const errBody = await res.json(); if (errBody && errBody.reason) reason = errBody.reason; }catch(e){}
      const err = new Error(reason);
      err.isModelError = !!modelInfo.param;
      throw err;
    }
    return res.json();
  }

  // ---------- عرض حالات عامة ----------
  function renderLoading(msg){
    app.innerHTML = '<div class="card state-box"><div class="spinner"></div><div class="msg">'+(msg||'يتم جلب حالة الطقس...')+'</div></div>';
  }
  function renderError(msg, onRetry){
    app.innerHTML = '<div class="card state-box"><span class="icon">⚠️</span><div class="msg">'+msg+'</div><button id="retryBtn">حاول مرة أخرى</button></div>';
    const b = document.getElementById('retryBtn');
    if (b) b.onclick = onRetry;
  }

  // ---------- المدن ----------
  function renderChips(){
    chips.innerHTML = cities.map(c => (
      '<button class="chip'+(c.id===currentCity.id?' active':'')+'" data-id="'+c.id+'">'+
        '<span>'+c.name+'</span>'+
        (cities.length>1 ? '<span class="rm" data-remove="'+c.id+'">✕</span>' : '')+
      '</button>'
    )).join('');
  }

  chips.addEventListener('click', (e)=>{
    const rm = e.target.closest('[data-remove]');
    if (rm){
      const id = rm.getAttribute('data-remove');
      cities = cities.filter(c=>c.id!==id);
      storageSet(LS_CITIES, cities);
      if (currentCity.id===id && cities.length){
        currentCity = cities[0];
        storageSet(LS_CURRENT, currentCity);
        renderChips();
        loadWeather();
      } else renderChips();
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip){
      const id = chip.getAttribute('data-id');
      const c = cities.find(x=>x.id===id);
      if (c && id!==currentCity.id){
        currentCity = c;
        storageSet(LS_CURRENT, currentCity);
        renderChips();
        loadWeather();
      }
    }
  });

  addCityBtn.addEventListener('click', ()=>{
    searchPanel.classList.toggle('open');
    if (searchPanel.classList.contains('open')) searchInput.focus();
  });

  let searchDebounce=null, searchSeq=0;
  async function doSearch(){
    const q = searchInput.value.trim();
    const mySeq = ++searchSeq;
    if (!q){ searchResults.innerHTML=''; return; }
    searchResults.innerHTML = '<div class="search-hint">جارٍ البحث...</div>';
    try{
      const results = await geocodeSearch(q);
      if (mySeq!==searchSeq) return;
      if (!results.length){ searchResults.innerHTML = '<div class="search-hint">لا توجد نتائج لـ "'+q+'"</div>'; return; }
      searchResults.innerHTML = results.slice(0,6).map(r=>{
        const label = r.name + (r.admin1 ? '، '+r.admin1 : '') + (r.country ? ' - '+r.country : '');
        return '<div class="search-result" data-lat="'+r.latitude+'" data-lon="'+r.longitude+'" data-name="'+label.replace(/"/g,'&quot;')+'"><span>📍 '+label+'</span><span>+ إضافة</span></div>';
      }).join('');
    }catch(err){
      if (mySeq!==searchSeq) return;
      searchResults.innerHTML = '<div class="search-hint">تعذّر البحث، تحقق من اتصالك بالإنترنت.</div>';
    }
  }
  searchInput.addEventListener('input', ()=>{ clearTimeout(searchDebounce); searchDebounce=setTimeout(doSearch,400); });
  searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ clearTimeout(searchDebounce); doSearch(); } });

  function addAndSelectCity(name, lat, lon){
    const id = lat.toFixed(3)+','+lon.toFixed(3);
    if (!cities.find(c=>c.id===id)){
      cities.push({id, name, lat, lon});
      if (cities.length>8) cities.shift();
      storageSet(LS_CITIES, cities);
    }
    currentCity = cities.find(c=>c.id===id);
    storageSet(LS_CURRENT, currentCity);
    searchPanel.classList.remove('open');
    searchInput.value=''; searchResults.innerHTML='';
    renderChips();
    loadWeather();
  }

  searchResults.addEventListener('click', (e)=>{
    const item = e.target.closest('.search-result');
    if (!item) return;
    addAndSelectCity(item.getAttribute('data-name'), parseFloat(item.getAttribute('data-lat')), parseFloat(item.getAttribute('data-lon')));
  });

  useMyLocationBtn.addEventListener('click', ()=> requestLocation(true));

  // ---------- Model Manager UI: تفعيل اختيار النموذج فعليًا ----------
  function applyModelToUI(){
    const info = WEATHER_MODELS[selectedModel] || WEATHER_MODELS.best_match;
    modelBtn.textContent = info.label + ' ▾';
    [...modelPanel.querySelectorAll('.model-option')].forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-model')===selectedModel);
    });
  }
  modelBtn.addEventListener('click', ()=>{
    modelPanel.classList.toggle('open');
  });
  modelPanel.addEventListener('click', (e)=>{
    const opt = e.target.closest('.model-option');
    if (!opt) return;
    const key = opt.getAttribute('data-model');
    if (key === selectedModel){ modelPanel.classList.remove('open'); return; }
    selectedModel = key;
    storageSet(LS_MODEL, selectedModel);
    applyModelToUI();
    modelPanel.classList.remove('open');
    if (currentCity) loadWeather();
  });

  function requestLocation(fromButton){
    if (!navigator.geolocation){
      if (fromButton) searchHint.textContent = 'المتصفح لا يدعم تحديد الموقع.';
      return;
    }
    if (fromButton){ searchHint.textContent = 'جارٍ تحديد موقعك...'; }
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const {latitude, longitude} = pos.coords;
      const name = await reverseGeocode(latitude, longitude);
      addAndSelectCity(name, latitude, longitude);
      if (fromButton) searchHint.textContent = 'اكتب اسم أي مدينة وأضفها لقائمتك، أو';
    }, (err)=>{
      if (fromButton) searchHint.textContent = 'تعذّر تحديد موقعك. اكتب اسم مدينتك يدويًا.';
    }, { timeout: 10000 });
  }

  // ---------- الوحدة ----------
  unitToggle.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-unit]');
    if (!btn) return;
    const nu = btn.getAttribute('data-unit');
    if (nu===unit) return;
    unit = nu;
    storageSet(LS_UNIT, unit);
    [...unitToggle.querySelectorAll('button')].forEach(b=>b.classList.toggle('active', b.getAttribute('data-unit')===unit));
    loadWeather();
  });

  refreshTop.addEventListener('click', ()=> loadWeather({silent:true}));

  // ---------- عرض الطقس ----------
  function fmtUpdated(){ return 'آخر تحديث: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
  function unitSuffix(){ return unit==='fahrenheit' ? '°ف' : '°م'; }

  function renderWeather(data, cityLabel){
    const cur = data.current || {};
    const daily = data.daily || {};
    const hourly = data.hourly || {};
    const isDay = !!cur.is_day;
    const icon = wmoIcon(cur.weather_code, isDay);
    titleIcon.textContent = icon;

    document.body.style.setProperty('--weatherTint', gradientForWeather(cur.weather_code, isDay, unit==='celsius'?cur.temperature_2m:null));
    document.body.style.backgroundImage = 'linear-gradient('+gradientForWeather(cur.weather_code,isDay,cur.temperature_2m)+','+gradientForWeather(cur.weather_code,isDay,cur.temperature_2m)+'), linear-gradient(180deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3))';

    const hiToday = daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[0]) : '--';
    const loToday = daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[0]) : '--';

    let aqiHtml = '';

    const alerts = [];
    if (isHazardCode(cur.weather_code)){
      alerts.push('حالة جوية شديدة الآن: '+wmoText(cur.weather_code)+' — يُنصح بالحذر.');
    }
    alertsBox.innerHTML = alerts.length ? alerts.map(a=>'<div class="alert-card"><div class="a-title">⚠️ '+a+'</div></div>').join('') : '';

    const now = new Date();
    let hourlyHtml = '';
    if (hourly.time){
      const startIdx = hourly.time.findIndex(t => new Date(t) >= now);
      const from = startIdx>=0?startIdx:0;
      hourlyHtml = hourly.time.slice(from, from+24).map((t,idx)=>{
        const realIdx = from+idx;
        const d = new Date(t);
        const label = idx===0 ? 'الآن' : d.toLocaleTimeString('ar-SA',{hour:'numeric'});
        const temp = Math.round(hourly.temperature_2m[realIdx]);
        const rp = hourly.precipitation_probability ? hourly.precipitation_probability[realIdx] : 0;
        const hIsDay = d.getHours()>=6 && d.getHours()<18;
        return '<div class="hitem"><div class="t">'+label+'</div><div class="ic">'+wmoIcon(hourly.weather_code[realIdx], hIsDay)+'</div><div class="v">'+temp+'°</div>'+(rp>10?'<div class="p">💧'+rp+'%</div>':'')+'</div>';
      }).join('');
    }

    let dailyHtml = '';
    if (daily.time){
      const maxTemp = Math.max(...daily.temperature_2m_max);
      const minTemp = Math.min(...daily.temperature_2m_min);
      const span = Math.max(1, maxTemp-minTemp);
      dailyHtml = daily.time.map((t,idx)=>{
        const d = new Date(t);
        const label = idx===0 ? 'اليوم' : d.toLocaleDateString('ar-SA',{weekday:'short'});
        const hi = Math.round(daily.temperature_2m_max[idx]);
        const lo = Math.round(daily.temperature_2m_min[idx]);
        const leftPct = ((lo-minTemp)/span)*100;
        const widthPct = ((hi-lo)/span)*100;
        const rp = daily.precipitation_probability_max ? daily.precipitation_probability_max[idx] : 0;
        return '<div class="drow">'+
          '<div class="dname">'+label+'</div>'+
          '<div class="dicon">'+wmoIcon(daily.weather_code[idx], true)+'</div>'+
          '<div class="dprecip">'+(rp>10?'💧'+rp+'%':'')+'</div>'+
          '<div class="drange"><span class="dlo">'+lo+'°</span>'+
          '<div class="bar-track"><div class="bar-fill" style="right:'+leftPct+'%; width:'+widthPct+'%;"></div></div>'+
          '<span class="dhi">'+hi+'°</span></div>'+
        '</div>';
      }).join('');
    }

    app.innerHTML =
      '<div class="card">'+
        '<div class="current-loc">📍 '+cityLabel+'</div>'+
        '<div class="current-date">'+now.toLocaleDateString('ar-SA',{weekday:'long', day:'numeric', month:'long'})+' · '+now.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})+'</div>'+
        '<div class="current-main"><div>'+
          '<div class="current-temp">'+Math.round(cur.temperature_2m)+unitSuffix()+'</div>'+
          '<div class="current-phrase">'+wmoText(cur.weather_code)+'</div>'+
          '<div class="current-feel">الإحساس الحراري '+Math.round(cur.apparent_temperature)+unitSuffix()+'</div>'+
          '<div class="current-hilo">'+hiToday+unitSuffix()+' / '+loToday+unitSuffix()+'</div>'+
        '</div><div class="current-icon">'+icon+'</div></div>'+
        aqiHtml+
        '<div class="detail-grid">'+
          '<div class="detail-item"><span class="icon">💧</span><div class="label">الرطوبة</div><div class="value">'+(cur.relative_humidity_2m ?? '--')+'%</div></div>'+
          '<div class="detail-item"><span class="icon">💨</span><div class="label">الرياح</div><div class="value">'+Math.round(cur.wind_speed_10m||0)+' كم/س</div></div>'+
          '<div class="detail-item"><span class="icon">🧭</span><div class="label">الضغط</div><div class="value">'+Math.round(cur.surface_pressure||0)+' hPa</div></div>'+
          '<div class="detail-item"><span class="icon">☀️</span><div class="label">UV</div><div class="value">'+(daily.uv_index_max?Math.round(daily.uv_index_max[0]):'--')+'</div></div>'+
          '<div class="detail-item"><span class="icon">🌅</span><div class="label">الشروق</div><div class="value">'+(daily.sunrise?new Date(daily.sunrise[0]).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'--')+'</div></div>'+
          '<div class="detail-item"><span class="icon">🌇</span><div class="label">الغروب</div><div class="value">'+(daily.sunset?new Date(daily.sunset[0]).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'--')+'</div></div>'+
        '</div>'+
        '<div class="updated-row"><span class="updated">'+fmtUpdated()+'</span><button class="refresh-btn" id="refreshInline">🔄</button></div>'+
      '</div>'+
      (hourlyHtml?'<div class="section-title">⏱️ خلال الساعات القادمة</div><div class="card tight"><div class="hourly-row">'+hourlyHtml+'</div></div>':'')+
      (dailyHtml?'<div class="section-title">📅 توقعات 7 أيام</div><div class="card tight"><div class="daily-list">'+dailyHtml+'</div></div>':'');

    const rInline = document.getElementById('refreshInline');
    if (rInline) rInline.addEventListener('click', ()=> loadWeather({silent:true}));
  }

  async function loadWeather(opts){
    opts = opts||{};
    if (!currentCity) return;
    if (!opts.silent) renderLoading('يتم تحميل حالة الطقس في '+currentCity.name+'...');
    else refreshTop.classList.add('spinning');
    if (!navigator.onLine){
      renderError('تحقق من اتصالك بالإنترنت.', ()=>loadWeather(opts));
      refreshTop.classList.remove('spinning');
      return;
    }
    try{
      const data = await fetchWeather(currentCity.lat, currentCity.lon, unit, selectedModel);
      renderWeather(data, currentCity.name);
      startLightningLoop();
    }catch(err){
      if (err && err.isModelError){
        renderError('تعذّر جلب بيانات نموذج "'+(WEATHER_MODELS[selectedModel]||{}).label+'" لهذا الموقع (قد لا يكون هذا النموذج يغطي هذه المنطقة). جرّب نموذجًا آخر أو "أفضل مزيج".', ()=>loadWeather(opts));
      } else {
        renderError('تعذّر جلب بيانات الطقس. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.', ()=>loadWeather(opts));
      }
    }
    refreshTop.classList.remove('spinning');
  }

  // ---------- الخريطة ----------
  let leafletMap = null, mapMarker = null;
  // نطاق العرض الافتراضي عند فتح الخريطة أول مرة: سوريا والمنطقة المحيطة (الوطن العربي)
  const DEFAULT_VIEW_BOUNDS = [[12,25],[42,55]];

  function initMap(){
    if (leafletMap) return;
    // minZoom:2 يسمح برؤية العالم كامل، والخريطة غير محصورة بمنطقة معينة بعد الآن
    leafletMap = L.map('leafletMap', { minZoom: 2 }).fitBounds(DEFAULT_VIEW_BOUNDS);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors', maxZoom: 18
    }).addTo(leafletMap);
    // حدود عالمية فضفاضة فقط لمنع التكرار اللانهائي للخريطة عند التمرير، وليست تقييدًا جغرافيًا
    leafletMap.setMaxBounds([[-85,-180],[85,180]]);
    leafletMap.on('click', async (e)=>{
      const {lat, lng} = e.latlng;
      if (mapMarker) leafletMap.removeLayer(mapMarker);
      mapMarker = L.marker([lat,lng]).addTo(leafletMap);
      mapWeatherResult.innerHTML = '<div class="card state-box"><div class="spinner"></div><div class="msg">يتم جلب طقس هذا الموقع...</div></div>';
      try{
        const data = await fetchWeather(lat, lng, unit, selectedModel);
        const cur = data.current || {};
        const icon = wmoIcon(cur.weather_code, !!cur.is_day);
        mapWeatherResult.innerHTML = '<div class="card">'+
          '<div class="current-loc">📍 '+lat.toFixed(3)+', '+lng.toFixed(3)+'</div>'+
          '<div class="current-main"><div>'+
            '<div class="current-temp">'+Math.round(cur.temperature_2m)+unitSuffix()+'</div>'+
            '<div class="current-phrase">'+wmoText(cur.weather_code)+'</div>'+
            '<div class="current-feel">الإحساس الحراري '+Math.round(cur.apparent_temperature)+unitSuffix()+'</div>'+
          '</div><div class="current-icon">'+icon+'</div></div>'+
          '<button class="primary-btn" id="addFromMapBtn" style="margin-top:14px; width:100%;">+ أضف هذا الموقع لقائمتي</button>'+
        '</div>';
        const addBtn = document.getElementById('addFromMapBtn');
        if (addBtn) addBtn.addEventListener('click', ()=>{
          addAndSelectCity('نقطة ('+lat.toFixed(2)+', '+lng.toFixed(2)+')', lat, lng);
          tabWeather.click();
        });
      }catch(err){
        mapWeatherResult.innerHTML = '<div class="card state-box"><span class="icon">⚠️</span><div class="msg">تعذّر جلب الطقس لهذا الموقع.</div></div>';
      }
    });
  }

  tabWeather.addEventListener('click', ()=>{
    tabWeather.classList.add('active'); tabMap.classList.remove('active');
    weatherView.style.display='block'; mapView.classList.remove('active');
  });
  tabMap.addEventListener('click', ()=>{
    tabMap.classList.add('active'); tabWeather.classList.remove('active');
    weatherView.style.display='none'; mapView.classList.add('active');
    initMap();
    setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 100);
  });

  // ---------- الإقلاع ----------
  async function bootstrap(){
    initSky();
    unit = storageGet(LS_UNIT,'celsius');
    [...unitToggle.querySelectorAll('button')].forEach(b=>b.classList.toggle('active', b.getAttribute('data-unit')===unit));

    selectedModel = storageGet(LS_MODEL, 'best_match');
    if (!WEATHER_MODELS[selectedModel]) selectedModel = 'best_match';
    applyModelToUI();

    cities = storageGet(LS_CITIES, []);
    currentCity = storageGet(LS_CURRENT, null);

    if (cities.length && currentCity && cities.find(c=>c.id===currentCity.id)){
      renderChips();
      loadWeather();
    } else if (cities.length){
      currentCity = cities[0];
      storageSet(LS_CURRENT, currentCity);
      renderChips();
      loadWeather();
    } else {
      renderLoading('جارٍ تحديد موقعك...');
      if (navigator.geolocation){
        navigator.geolocation.getCurrentPosition(async (pos)=>{
          const {latitude, longitude} = pos.coords;
          const name = await reverseGeocode(latitude, longitude);
          addAndSelectCity(name, latitude, longitude);
        }, async ()=>{
          // فشل تحديد الموقع: استخدم دمشق كافتراضي
          try{
            const res = await geocodeSearch('دمشق');
            const r = res[0];
            if (r) addAndSelectCity('دمشق', r.latitude, r.longitude);
            else renderError('تعذّر تحديد موقعك وتحميل مدينة افتراضية.', bootstrap);
          }catch(e){
            renderError('تحقق من اتصالك بالإنترنت ثم أعد المحاولة.', bootstrap);
          }
        }, { timeout: 8000 });
      } else {
        try{
          const res = await geocodeSearch('دمشق');
          const r = res[0];
          if (r) addAndSelectCity('دمشق', r.latitude, r.longitude);
        }catch(e){
          renderError('تحقق من اتصالك بالإنترنت ثم أعد المحاولة.', bootstrap);
        }
      }
    }

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(()=> loadWeather({silent:true}), 10*60*1000);
  }

  bootstrap();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
